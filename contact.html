<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jomarie Callueng</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">JC</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <main class="container">
        <h2 class="page-title">Get In Touch</h2>
        <form class="contact-form" action="#" method="POST" id="contactForm" novalidate>
            
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <!-- pattern: Bawal ang numbers, letters at spaces lang -->
                <input type="text" id="fullName" name="fullName" placeholder="e.g. Juan Cruz" pattern="^[a-zA-Z\s]+$" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="e.g. juan@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <!-- pattern: 11 digits lang (e.g. 09123456789) -->
                <input type="tel" id="phone" name="phone" placeholder="e.g. 09123456789" maxlength="11" pattern="^[0-9]{11}$" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" placeholder="e.g. Web Design Proposal / Inquiry" required>
            </div>

            <div class="form-group">
                <label for="inquiryType">Inquiry Type:</label>
                <select id="inquiryType" name="inquiryType">
                    <option value="freelance">Freelance Project</option>
                    <option value="employment">Job Opportunity</option>
                    <option value="general">General Question</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preferred Contact Method:</label>
                <div class="radio-group">
                    <input type="radio" id="contactEmail" name="prefContact" value="email" checked>
                    <label for="contactEmail">Email</label>
                    <input type="radio" id="contactPhone" name="prefContact" value="phone">
                    <label for="contactPhone">Phone</label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Submit</button>
                <button type="reset" class="btn btn-alt">Reset</button>
            </div>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
